[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cotmetrics"
version = "0.5.0"
description = "Turn raw COT data into positioning metrics and trading signals (positioning index, concentration/clustering/position-size, reversal signals)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "Matt S.", email = "cotanalyzer@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "numpy",
    "pyarrow>=10",
    "PyYAML>=6.0",
    "pytz",
    "requests>=2.28",       # legacy CFTC ETL (cotmetrics.etl)
    "xlrd>=2.0",            # legacy CFTC dea_fut_xls are .xls
    "cotdata>=0.1.0",       # COT positioning; editable in the workspace: -e ../cotdata
    # Daily bars (ADR-0007 moved them out of cotdata); editable: -e ../marketdata.
    # The DISTRIBUTION is crucible-marketdata because `marketdata` on PyPI is an
    # unrelated abandoned project; the IMPORT is still `marketdata`.
    #
    # FLOOR 0.2.0, and it is a correctness floor rather than a convenience one.
    # `exposure.point_value_series` needs `marketdata.read_contract_regimes` /
    # `point_value_asof` (added there in 0.2.0) to value a week at the multiplier that
    # was in force THAT week. Against 0.1.0 it raises rather than falling back, because
    # the flat answer is wrong by 2x on RTY before 2016-12-05 and wrong invisibly.
    "crucible-marketdata>=0.2.0",
]

[project.optional-dependencies]
options = ["yfinance"]      # cotmetrics.options_data (max-pain snapshots)
dev = ["pytest>=7", "ruff==0.15.22", 'tomli; python_version < "3.11"']  # tomli for scripts/check_dep_floors.py on <3.11

[project.urls]
Homepage = "https://github.com/mspinola/cotmetrics"
Repository = "https://github.com/mspinola/cotmetrics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cotmetrics = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
